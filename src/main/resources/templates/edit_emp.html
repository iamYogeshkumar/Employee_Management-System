<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org"
	th:replace="~{base::Layout(~{::title},~{::section})}">
<head>
<meta charset="UTF-8">
<title>Edit emp Form</title>
</head>
<body>
	<section>
		<div class="container">
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<div class="card">
						<div class="card-header text-center">
							<p class="fs-4">Edit_Emp</p>
							<th:block th:if="${session.msg }">
							<p class="text-center text-success fs-4">[[${session.msg}]]</p>
							</th:block>
							<th:block th:text="${@employeeServiceImpl.remSessionMsg()}"></th:block>
						</div>
						<div class="card-body">
							<form action="/updateEmpDtls" method="post">
							<input type="hidden" name="id" th:value="${emp.id}" />
								<div class="mb-3">
									<label for="exampleInputEmail1" class="form-label">FullName
										address</label> <input type="text" name="name" class="form-control" th:value="${emp.name}">

								</div>

								<div class="mb-3">
									<label for="exampleInputEmail1" class="form-label">Email
										address</label> <input type="email" name="email" class="form-control" th:value="${emp.email}">

								</div>

								<div class="mb-3">
									<label for="exampleInputEmail1" class="form-label">
										address</label> <input type="text" name="address" class="form-control" th:value="${emp.address}">

								</div>

								<div class="mb-3">
									<label for="exampleInputEmail1" class="form-label">salary
									</label> <input type="number" name="salary" class="form-control" th:value="${emp.salary}">

								</div>

								<div class="mb-3">
								<label for="exampleInputEmail1" class="form-label">Gender
									</label>
									<div class="form-check form-check-inline">
										<input class="form-check-input" type="radio"
											name="gender" id="inlineRadio1" value="Male"  th:attrappend="checked=${emp.gender=='Male'? 'checked' : ''}"   th:value="${emp.gender}">
										<label class="form-check-label" for="inlineRadio1">Male</label>
									</div>
									<div class="form-check form-check-inline">
										<input class="form-check-input" type="radio"
											name="gender" id="inlineRadio2" value="Female" th:attrappend="checked=${emp.gender=='Female'? 'checked' : ''}"   >
										<label class="form-check-label" for="inlineRadio2">Female</label>
									</div>
									

								</div>



								<div class="mb-3">
									<label for="exampleInputPassword1" class="form-label">Password</label>
									<input type="password" name="password" class="form-control" th:value="${emp.password}"
										id="exampleInputPassword1">
								</div>

								<button type="submit" class="btn btn-primary">update</button>
							</form>


						</div>

					</div>



				</div>
			</div>
		</div>
	</section>
</body>
</html>
